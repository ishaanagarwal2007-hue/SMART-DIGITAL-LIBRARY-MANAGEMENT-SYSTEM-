<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef1f5;
    margin: 0;
    padding: 40px 20px;
  }
  form {
    max-width: 520px;
    margin: 0 auto;
    background: #fff;
    padding: 36px 40px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  h1 {
    text-align: center;
    color: #1f3b73;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-bottom: 26px;
  }
  fieldset {
    border: 1px solid #dfe3ea;
    border-radius: 8px;
    padding: 16px 18px 20px;
    margin-bottom: 20px;
  }
  legend {
    padding: 0 8px;
    color: #1f3b73;
    font-weight: bold;
    font-size: 14px;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13.5px;
    color: #333;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input[type="text"],
  input[type="email"],
  input[type="password"],
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c9d0dc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #4a6fa5;
    box-shadow: 0 0 0 3px rgba(74,111,165,0.15);
  }
  .radio-group, .checkbox-group {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
  }
  .radio-group label, .checkbox-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: normal;
    margin-bottom: 0;
    font-size: 14px;
  }
  .radio-group input, .checkbox-group input {
    width: auto;
    margin: 0;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #1f3b73;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  button:hover { background: #16294f; }
  .terms {
    font-size: 12.5px;
    color: #666;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .terms input { width: auto; }
</style>
</head>
<body>

<form action="#" method="post">
  <h1>Create an Account</h1>
  <p class="subtitle">Fill in your details to register</p>

  <fieldset>
    <legend>Personal Information</legend>

    <div class="field">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="radio-group">
        <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
        <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label>
        <label for="other"><input type="radio" id="other" name="gender" value="other"> Other</label>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Preferences</legend>

    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">-- Select Country --</option>
        <option value="india">India</option>
        <option value="usa">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="canada">Canada</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label>Interests</label>
      <div class="checkbox-group">
        <label for="coding"><input type="checkbox" id="coding" name="interests" value="coding"> Coding</label>
        <label for="music"><input type="checkbox" id="music" name="interests" value="music"> Music</label>
        <label for="sports"><input type="checkbox" id="sports" name="interests" value="sports"> Sports</label>
        <label for="reading"><input type="checkbox" id="reading" name="interests" value="reading"> Reading</label>
      </div>
    </div>
  </fieldset>

  <div class="terms">
    <input type="checkbox" id="agree" name="agree" required>
    <label for="agree" style="margin:0; font-weight:normal;">I agree to the Terms &amp; Conditions and Privacy Policy</label>
  </div>

  <button type="submit">Register</button>
</form>

</body>
</html>
