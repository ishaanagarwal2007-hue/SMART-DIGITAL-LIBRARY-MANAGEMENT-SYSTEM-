<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1f3b73, #4a6fa5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #fff;
    width: 100%;
    max-width: 380px;
    border-radius: 12px;
    padding: 38px 34px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .icon-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #eaf0fb;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 26px;
    color: #1f3b73;
  }
  h1 {
    text-align: center;
    font-size: 21px;
    color: #222;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 26px;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #d7dce4;
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
  }
  input:focus {
    outline: none;
    border-color: #4a6fa5;
    box-shadow: 0 0 0 3px rgba(74,111,165,0.15);
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    margin-bottom: 22px;
    color: #555;
  }
  .row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: normal;
    margin: 0;
  }
  .row a {
    color: #4a6fa5;
    text-decoration: none;
  }
  .row a:hover { text-decoration: underline; }
  button {
    width: 100%;
    padding: 12px;
    background: #1f3b73;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #16294f; }
  .signup {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-top: 20px;
  }
  .signup a {
    color: #1f3b73;
    font-weight: bold;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="icon-circle">&#128274;</div>
  <h1>Welcome Back</h1>
  <p class="subtitle">Please login to your account</p>

  <form action="#" method="post">
    <div class="field">
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" placeholder="Enter username or email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>

    <div class="row">
      <label for="remember"><input type="checkbox" id="remember" name="remember"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Login</button>
  </form>

  <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
</div>

</body>
</html>
